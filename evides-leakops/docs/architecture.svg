<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #475569; }
      .zone { font-size: 13px; font-weight: 700; fill: #2e7d32; }
      .h { font-size: 17px; font-weight: 700; fill: #1e293b; }
      .hs { font-size: 12px; fill: #64748b; }
      .ct { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .cs { font-size: 12px; fill: #64748b; }
      .foot { font-size: 12px; fill: #1e3a8a; text-anchor: middle; }
      .lbl { font-size: 11px; fill: #475569; text-anchor: middle; }
      .ico { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .chip { font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; filter: url(#shadow); }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .thin { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1480" height="800" fill="#f6f8fc"/>

